                message || ''
            ),

        type:
            type || 'info'
    });
};


/*
 * 解除目前已載入的 Workspace 關聯。
 *
 * 只清除目前頁面的：
 * Workspace ID、名稱與 Revision。
 *
 * 不會刪除 Supabase 上的工作資料，
 * 也不會清除目前法規鑑別畫面資料。
 */
const clearActiveCloudWorkspace =
    () => {

    setActiveCloudWorkspaceId(
        ''
    );

    setActiveCloudWorkspaceName(
        ''
    );

    setActiveCloudWorkspaceRevision(
        0
    );
};


/*
 * 讀取目前法規鑑別系統的
 * Cloud Workspace 清單。
 */
const loadCloudWorkspaceList =
    async () => {

    /*
     * 其他 Workspace 操作進行中時，
     * 不重複送出清單請求。
     */
    if (
        cloudWorkspaceListBusy ||
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    setCloudWorkspaceListBusy(
        true
    );

    updateCloudWorkspaceStatus(
        '正在讀取雲端工作資料...',
        'info'
    );

    try {
        const result =
            await cloudWorkspaceRequest({
                action:
                    'list',

                system_type:
                    OSH_CLOUD_SYSTEM_TYPE
            });

        const workspaces =
            Array.isArray(
                result?.workspaces
            )
                ? result.workspaces
                : [];

        setCloudWorkspaceItems(
            workspaces
        );

        updateCloudWorkspaceStatus(
            workspaces.length > 0
                ? (
                    '已讀取 ' +
                    workspaces.length +
                    ' 份雲端工作資料。'
                )
                : '目前尚未建立雲端工作資料。',
            'success'
        );

    } catch (error) {
        console.error(
            '讀取 Cloud Workspace 清單失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        /*
         * 使用者主動取消第二層登入，
         * 不顯示成服務故障。
         */
        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        setCloudWorkspaceItems(
            []
        );

        let message =
            '無法讀取雲端工作資料，請稍後再試。';

        if (
            error?.status ===
            401
        ) {
            clearCloudPublisherSession();

            message =
                'Cloud Publisher 登入已失效，請重新登入。';

        } else if (
            error?.status ===
            403
        ) {
            clearCloudPublisherSession();

            message =
                '此帳號目前沒有雲端工作資料使用權限。';
        }

        updateCloudWorkspaceStatus(
            message,
            'error'
        );

    } finally {
        setCloudWorkspaceListBusy(
            false
        );
    }
};

/*
 * 建立新的法規鑑別 Cloud Workspace。
 *
 * 法規系統目前沒有附件，
 * 因此可以直接將正式 unified-data
 * 寫入新建立的 Workspace。
 */
const createCloudWorkspaceFromCurrentData =
    async () => {

    const role =
        getCurrentRole();

    /*
     * Viewer 不能建立 Workspace。
     */
    if (
        role !== 'admin' &&
        role !== 'editor'
    ) {
        updateCloudWorkspaceStatus(
            '目前權限無法建立雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * Viewer Preview 資料
     * 不能轉存成正式 Workspace。
     */
    if (
        previewDataModeRef.current
    ) {
        updateCloudWorkspaceStatus(
            '預覽資料不能建立雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 法規監控清單或鑑別工作台
     * 若還有尚未按下綠色儲存的修改，
     * 先阻止建立 Workspace。
     */
    if (
        hasAnyUnsavedChanges()
    ) {
        updateCloudWorkspaceStatus(
            '請先儲存目前的法規鑑別修改後，再建立雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 其他 Workspace 操作進行中時，
     * 不重複建立。
     */
    if (
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceListBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    setCloudWorkspaceCreateBusy(
        true
    );

    updateCloudWorkspaceStatus(
        '正在建立雲端工作資料...',
        'info'
    );

    try {
        const currentYear =
            new Date()
                .getFullYear();

        const workspaceName =
            currentYear +
            '年度法規鑑別工作資料';

        /*
         * 建立法規系統正式 unified-data。
         */
        const localPayload =
            buildRegulationIdentificationExportData();

        /*
         * 建立獨立 JSON-safe Cloud Payload。
         */
        const cloudPayload =
            buildRegulationIdentificationCloudPayload(
                localPayload
            );

        const result =
            await cloudWorkspaceRequest({
                action:
                    'create',

                system_type:
                    OSH_CLOUD_SYSTEM_TYPE,

                workspace_name:
                    workspaceName,

                payload:
                    cloudPayload
            });

        const workspace =
            result?.workspace;

        if (
            !workspace?.id
        ) {
            throw new Error(
                'WORKSPACE_CREATE_INVALID'
            );
        }

        const workspaceId =
            String(
                workspace.id
            );

        const savedName =
            String(
                workspace.workspace_name ||
                workspaceName
            );

        const revision =
            Number(
                workspace.revision
            ) || 1;

        /*
         * 新建立的 Workspace
         * 立即成為目前 Active Workspace。
         */
        setActiveCloudWorkspaceId(
            workspaceId
        );

        setActiveCloudWorkspaceName(
            savedName
        );

        setActiveCloudWorkspaceRevision(
            revision
        );

        /*
         * 儲存至 Cloud 不等於
         * 已匯出正式 JSON。
         */
        sessionNeedsExportRef.current =
            true;

        updateCloudWorkspaceStatus(
            '已建立「' +
            savedName +
            '」Revision ' +
            revision +
            '。',
            'success'
        );

        /*
         * 重新讀取清單，
         * 顯示剛建立的 Workspace。
         */
        await loadCloudWorkspaceList();

        showSystemToast(
            '雲端工作資料已建立'
        );

    } catch (error) {
        console.error(
            '建立 Cloud Workspace 失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        /*
         * 自行取消第二層登入，
         * 不顯示成資料損壞。
         */
        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        const messages = {
            WORKSPACE_CREATE_FAILED:
                '建立雲端工作資料失敗。',

            WORKSPACE_CREATE_INVALID:
                '雲端工作資料建立結果不完整。',

            WORKSPACE_NAME_INVALID:
                '雲端工作資料名稱無效。',

            WORKSPACE_SYSTEM_MISMATCH:
                '雲端工作資料系統識別不正確。',

            WORKSPACE_PAYLOAD_INVALID:
                '法規鑑別資料格式不完整。'
        };

        updateCloudWorkspaceStatus(
            messages[code] ||
            code ||
            '建立雲端工作資料失敗。',
            'error'
        );

    } finally {
        setCloudWorkspaceCreateBusy(
            false
        );
    }
};

/*
 * 載入 Cloud Workspace
 * 到法規鑑別正式工作區。
 */
const loadCloudWorkspaceIntoSystem =
    async (
        workspaceId
    ) => {

    const role =
        getCurrentRole();

    /*
     * Viewer 不能載入 Workspace。
     */
    if (
        role !== 'admin' &&
        role !== 'editor'
    ) {
        showSystemToast(
            '雲端工作資料僅供管理者與使用者使用。',
            'error'
        );

        return;
    }

    /*
     * 預覽模式不能直接覆蓋成 Workspace。
     */
    if (
        previewDataModeRef.current
    ) {
        updateCloudWorkspaceStatus(
            '請先退出目前預覽資料，再載入雲端工作資料。',
            'error'
        );

        return;
    }

    const normalizedWorkspaceId =
        String(
            workspaceId || ''
        ).trim();

    if (!normalizedWorkspaceId) {
        updateCloudWorkspaceStatus(
            '雲端工作資料識別碼無效。',
            'error'
        );

        return;
    }

    /*
     * 其他 Workspace 操作進行中時，
     * 不重複送出載入請求。
     */
    if (
        cloudWorkspaceListBusy ||
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    /*
     * 載入 Workspace 會覆蓋
     * 目前法規鑑別工作區。
     */
    const pendingWarning =
        hasPendingSessionChanges()
            ? (
                '\n\n目前有尚未儲存或尚未匯出的工作成果，' +
                '繼續後將被覆蓋。'
            )
            : '';

    const confirmed =
        window.confirm(
            '載入雲端工作資料將覆蓋目前法規鑑別工作區內容，確定要繼續嗎？' +
            pendingWarning
        );

    if (!confirmed) {
        return;
    }

    setCloudWorkspaceAction({
        workspaceId:
            normalizedWorkspaceId,

        type:
            'load'
    });

    updateCloudWorkspaceStatus(
        '正在讀取雲端工作資料...',
        'info'
    );

    try {
        const result =
            await cloudWorkspaceRequest({
                action:
                    'load',

                system_type:
                    OSH_CLOUD_SYSTEM_TYPE,

                workspace_id:
                    normalizedWorkspaceId
            });

        const workspace =
            result?.workspace;

        if (
            !workspace ||
            typeof workspace !==
                'object' ||
            Array.isArray(
                workspace
            )
        ) {
            throw new Error(
                'WORKSPACE_LOAD_INVALID'
            );
        }

        /*
         * 再確認 Workspace
         * 屬於法規鑑別系統。
         */
        if (
            String(
                workspace.system_type ||
                ''
            ) !==
            OSH_CLOUD_SYSTEM_TYPE
        ) {
            throw new Error(
                'WORKSPACE_SYSTEM_MISMATCH'
            );
        }

        const sourcePayload =
            workspace.payload;

        /*
         * Workspace 必須是
         * 法規鑑別正式 unified-data。
         */
        if (
            !sourcePayload ||
            typeof sourcePayload !==
                'object' ||
            Array.isArray(
                sourcePayload
            ) ||
            sourcePayload.version !==
                'regulation-identification-system-json-v2' ||
            sourcePayload.exportType !==
                'unified-data' ||
            !Array.isArray(
                sourcePayload.laws
            ) ||
            !sourcePayload.lawDetails ||
            typeof sourcePayload.lawDetails !==
                'object' ||
            Array.isArray(
                sourcePayload.lawDetails
            )
        ) {
            throw new Error(
                'WORKSPACE_PAYLOAD_INVALID'
            );
        }

        /*
         * 法規系統目前沒有附件，
         * hydrate 只建立安全資料副本。
         */
        const hydratedPayload =
            hydrateRegulationIdentificationCloudPayload(
                sourcePayload
            );

        /*
         * 使用法規系統既有的
         * 正式資料格式驗證。
         */
        const parsedData =
            applyImportedRegulationData(
                hydratedPayload
            );

        /*
         * 正式載入前清除舊版 IndexedDB，
         * 避免瀏覽器保留舊資料。
         */
        await dbManager.clearAll();

        /*
         * 停止先前可能存在的
         * 本機或 Cloud Preview Timer。
         */
        clearLimitedPreviewRuntimeState();

        previewReturnLawsRef.current =
            null;

        previewReturnLawDetailsRef.current =
            null;

        previewDataModeRef.current =
            false;

        setIsPreviewDataMode(
            false
        );

        /*
         * 載入後回到檢視模式。
         */
        setIsMonitorEditMode(
            false
        );

        setIsWorkbenchEditMode(
            false
        );

        /*
         * 新載入的 Workspace
         * 沒有尚未按綠色儲存的修改。
         */
        monitorManualDirtyRef.current =
            false;

        workbenchManualDirtyRef.current =
            false;

        monitorCascadeDetailsDirtyRef.current =
            false;

        pendingDeletedLawIdsRef
            .current
            .clear();

        /*
         * 剛載入的 Workspace
         * 已經是正式存在的工作成果。
         */
        sessionNeedsExportRef.current =
            false;

        setSelectedLaw(
            null
        );

        setActiveTab(
            'monitor'
        );

        setLaws(
            parsedData.laws
        );

        setLawDetails(
            parsedData.lawDetails
        );

        const loadedWorkspaceName =
            String(
                workspace.workspace_name ||
                '雲端工作資料'
            );

        const loadedRevision =
            Number(
                workspace.revision
            ) || 1;

        /*
         * 記住目前 Workspace
         * 身分與 Revision。
         */
        setActiveCloudWorkspaceId(
            String(
                workspace.id ||
                normalizedWorkspaceId
            )
        );

        setActiveCloudWorkspaceName(
            loadedWorkspaceName
        );

        setActiveCloudWorkspaceRevision(
            loadedRevision
        );

        updateCloudWorkspaceStatus(
            '已載入「' +
            loadedWorkspaceName +
            '」Revision ' +
            loadedRevision +
            '。',
            'success'
        );

        /*
         * 先解除忙碌狀態，
         * 再關閉雲端中心。
         */
        setCloudWorkspaceAction({
            workspaceId: '',
            type: ''
        });

        closeCloudCenterModal(
            true
        );

        showSystemToast(
            '已載入「' +
            loadedWorkspaceName +
            '」Revision ' +
            loadedRevision
        );

    } catch (error) {
        console.error(
            '載入 Cloud Workspace 失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        const messages = {
            WORKSPACE_NOT_FOUND:
                '找不到這份雲端工作資料。',

            WORKSPACE_DISABLED:
                '這份雲端工作資料目前已停用，無法載入。',

            WORKSPACE_LOAD_FAILED:
                '讀取雲端工作資料失敗。',

            WORKSPACE_LOAD_INVALID:
                '雲端工作資料載入結果不完整。',

            WORKSPACE_FILES_FAILED:
                '讀取雲端工作資料附件清單失敗。',

            WORKSPACE_SYSTEM_MISMATCH:
                '此雲端工作資料不屬於目前法規鑑別系統。',

            WORKSPACE_PAYLOAD_INVALID:
                '雲端工作資料格式不完整或不是有效的法規鑑別資料。'
        };

        updateCloudWorkspaceStatus(
            messages[code] ||
            code ||
            '載入雲端工作資料失敗。',
            'error'
        );

    } finally {
        setCloudWorkspaceAction({
            workspaceId: '',
            type: ''
        });
    }
};

/*
 * 儲存目前已載入的 Cloud Workspace。
 *
 * 法規系統沒有附件，
 * 因此只需要儲存正式 unified-data
 * 與處理 Revision 版本鎖。
 */
const saveCurrentCloudWorkspace =
    async () => {

    const role =
        getCurrentRole();

    /*
     * Viewer 不能儲存 Workspace。
     */
    if (
        role !== 'admin' &&
        role !== 'editor'
    ) {
        showSystemToast(
            '目前權限無法儲存雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 預覽資料不能寫回 Workspace。
     */
    if (
        previewDataModeRef.current
    ) {
        updateCloudWorkspaceStatus(
            '預覽資料不能儲存至雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 必須已經載入或建立 Workspace。
     */
    if (
        !activeCloudWorkspaceId ||
        activeCloudWorkspaceRevision < 1
    ) {
        updateCloudWorkspaceStatus(
            '目前尚未載入任何雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 先完成法規系統本身的綠色儲存，
     * 再寫入 Cloud Workspace。
     */
    if (
        hasAnyUnsavedChanges()
    ) {
        updateCloudWorkspaceStatus(
            '請先儲存目前的法規鑑別修改後，再儲存至雲端。',
            'error'
        );

        return;
    }

    /*
     * 其他 Workspace 操作進行中時，
     * 不重複儲存。
     */
    if (
        cloudWorkspaceListBusy ||
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    setCloudWorkspaceSaveBusy(
        true
    );

    updateCloudWorkspaceStatus(
        '正在儲存 Revision ' +
        activeCloudWorkspaceRevision +
        '...',
        'info'
    );

    try {
        const localPayload =
            buildRegulationIdentificationExportData();

        const cloudPayload =
            buildRegulationIdentificationWorkspaceSavePayload(
                localPayload
            );

        /*
         * 使用目前 Revision 作為版本鎖。
         */
        const result =
            await cloudWorkspaceRequest({
                action:
                    'save',

                system_type:
                    OSH_CLOUD_SYSTEM_TYPE,

                workspace_id:
                    activeCloudWorkspaceId,

                revision:
                    activeCloudWorkspaceRevision,

                payload:
                    cloudPayload
            });

        const workspace =
            result?.workspace;

        if (
            !workspace?.id
        ) {
            throw new Error(
                'WORKSPACE_SAVE_INVALID'
            );
        }

        const savedName =
            String(
                workspace.workspace_name ||
                activeCloudWorkspaceName ||
                '雲端工作資料'
            );

        const savedRevision =
            Number(
                workspace.revision
            ) ||
            (
                activeCloudWorkspaceRevision +
                1
            );

        setActiveCloudWorkspaceName(
            savedName
        );

        setActiveCloudWorkspaceRevision(
            savedRevision
        );

        /*
         * Cloud Save 不等於
         * 已匯出正式 JSON。
         */
        sessionNeedsExportRef.current =
            true;

        /*
         * 重新取得 Server 最新 Revision。
         */
        await loadCloudWorkspaceList();

        updateCloudWorkspaceStatus(
            '已儲存「' +
            savedName +
            '」Revision ' +
            savedRevision +
            '。',
            'success'
        );

        showSystemToast(
            '雲端工作資料已儲存為 Revision ' +
            savedRevision
        );

    } catch (error) {
        console.error(
            '儲存 Cloud Workspace 失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        const messages = {
            WORKSPACE_NOT_FOUND:
                '目前雲端工作資料已不存在。',

            WORKSPACE_DISABLED:
                '目前雲端工作資料已被停用，無法繼續儲存。',

            WORKSPACE_SAVE_FAILED:
                '雲端工作資料儲存失敗。',

            WORKSPACE_SAVE_INVALID:
                '雲端工作資料儲存結果不完整。',

            WORKSPACE_REVISION_INVALID:
                '雲端工作版本資訊無效。',

            WORKSPACE_REVISION_CONFLICT:
                '此雲端工作資料已被其他使用者更新，請重新載入最新版本後再繼續。',

            WORKSPACE_SYSTEM_MISMATCH:
                '此雲端工作資料不屬於目前法規鑑別系統。',

            WORKSPACE_PAYLOAD_INVALID:
                '法規鑑別資料格式不完整。'
        };

        /*
         * Workspace 已被停用或刪除時，
         * 只解除目前 Cloud 關聯，
         * 不清除畫面上的法規資料。
         */
        if (
            code ===
                'WORKSPACE_DISABLED' ||
            code ===
                'WORKSPACE_NOT_FOUND'
        ) {
            clearActiveCloudWorkspace();
        }

        /*
         * 衝突、停用或刪除時，
         * 重新取得 Server 清單。
         */
        if (
            code ===
                'WORKSPACE_REVISION_CONFLICT' ||
            code ===
                'WORKSPACE_DISABLED' ||
            code ===
                'WORKSPACE_NOT_FOUND'
        ) {
            try {
                await loadCloudWorkspaceList();
            } catch (_) {}
        }

        updateCloudWorkspaceStatus(
            messages[code] ||
            code ||
            '雲端工作資料儲存失敗。',
            'error'
        );

        /*
         * Revision 衝突時不覆蓋 Server，
         * 並保留目前畫面上的本機修改。
         */
        if (
            code ===
            'WORKSPACE_REVISION_CONFLICT'
        ) {
            window.alert(
                '雲端資料已有較新的版本。\n\n' +
                '目前這份舊版本不會覆蓋其他人的修改。\n' +
                '請重新載入最新雲端工作資料後，再進行編輯。'
            );
        }

    } finally {
        setCloudWorkspaceSaveBusy(
            false
        );
    }
};

/* =========================================================
   Cloud Workspace：編輯工作資料名稱
========================================================= */

/*
 * 更新 Workspace 改名視窗訊息。
 */
const updateCloudWorkspaceRenameStatus =
    (
        message,
        type = 'info'
    ) => {

    setCloudWorkspaceRenameStatus({
        message:
            String(
                message || ''
            ),

        type:
            type || 'info'
    });
};


/*
 * 開啟 Workspace 改名視窗。
 */
const openCloudWorkspaceRenameModal =
    (
        workspace
    ) => {

    const role =
        getCurrentRole();

    /*
     * 管理者與使用者都可以修改名稱。
     */
    if (
        role !== 'admin' &&
        role !== 'editor'
    ) {
        showSystemToast(
            '目前權限無法編輯雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 其他 Workspace 操作進行中時，
     * 不開啟改名視窗。
     */
    if (
        cloudWorkspaceListBusy ||
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    const workspaceId =
        String(
            workspace?.id ||
            ''
        ).trim();

    const workspaceName =
        String(
            workspace?.workspace_name ||
            ''
        ).trim();

    if (!workspaceId) {
        updateCloudWorkspaceStatus(
            '找不到要編輯的雲端工作資料。',
            'error'
        );

        return;
    }

    setCloudWorkspaceRenameTarget({
        workspaceId:
            workspaceId,

        workspaceName:
            workspaceName
    });

    setCloudWorkspaceRenameName(
        workspaceName
    );

    updateCloudWorkspaceRenameStatus(
        ''
    );

    setShowCloudWorkspaceRenameModal(
        true
    );

    /*
     * 只讓輸入框取得焦點。
     *
     * 不使用 select()，
     * 避免名稱自動反藍全選。
     */
    requestAnimationFrame(
        () => {
            cloudWorkspaceRenameNameInputRef
                .current
                ?.focus();
        }
    );
};


/*
 * 關閉 Workspace 改名視窗。
 */
const closeCloudWorkspaceRenameModal =
    (
        force = false
    ) => {

    /*
     * 儲存進行中不能關閉；
     * 系統完成清理時可使用 force。
     */
    if (
        cloudWorkspaceRenameBusy &&
        !force
    ) {
        return;
    }

    setShowCloudWorkspaceRenameModal(
        false
    );

    setCloudWorkspaceRenameTarget({
        workspaceId: '',
        workspaceName: ''
    });

    setCloudWorkspaceRenameName(
        ''
    );

    setCloudWorkspaceRenameStatus({
        message: '',
        type: 'info'
    });

    if (force) {
        setCloudWorkspaceRenameBusy(
            false
        );
    }
};


/*
 * 送出 Workspace 名稱修改。
 */
const submitCloudWorkspaceRename =
    async () => {

    const role =
        getCurrentRole();

    if (
        role !== 'admin' &&
        role !== 'editor'
    ) {
        updateCloudWorkspaceRenameStatus(
            '目前權限無法編輯雲端工作資料。',
            'error'
        );

        return;
    }

    if (
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    const workspaceId =
        String(
            cloudWorkspaceRenameTarget
                .workspaceId ||
            ''
        ).trim();

    const originalName =
        String(
            cloudWorkspaceRenameTarget
                .workspaceName ||
            ''
        ).trim();

    const workspaceName =
        String(
            cloudWorkspaceRenameName ||
            ''
        ).trim();

    if (!workspaceId) {
        updateCloudWorkspaceRenameStatus(
            '找不到要編輯的雲端工作資料。',
            'error'
        );

        return;
    }

    if (!workspaceName) {
        updateCloudWorkspaceRenameStatus(
            '請輸入工作資料名稱。',
            'error'
        );

        cloudWorkspaceRenameNameInputRef
            .current
            ?.focus();

        return;
    }

    if (
        workspaceName.length >
        100
    ) {
        updateCloudWorkspaceRenameStatus(
            '工作資料名稱不可超過 100 個字元。',
            'error'
        );

        cloudWorkspaceRenameNameInputRef
            .current
            ?.focus();

        return;
    }

    /*
     * 名稱沒有變更時直接關閉，
     * 不送出不必要的 API 請求。
     */
    if (
        workspaceName ===
        originalName
    ) {
        closeCloudWorkspaceRenameModal();

        return;
    }

    setCloudWorkspaceRenameBusy(
        true
    );

    updateCloudWorkspaceRenameStatus(
        '正在儲存名稱...',
        'info'
    );

    try {
        const result =
            await cloudWorkspaceRequest({
                action:
                    'rename',

                system_type:
                    OSH_CLOUD_SYSTEM_TYPE,

                workspace_id:
                    workspaceId,

                workspace_name:
                    workspaceName
            });

        const renamed =
            result?.workspace;

        if (
            !renamed?.id
        ) {
            throw new Error(
                'WORKSPACE_RENAME_INVALID'
            );
        }

        const savedName =
            String(
                renamed.workspace_name ||
                workspaceName
            ).trim() ||
            workspaceName;

        /*
         * 若修改的是目前已載入的 Workspace，
         * 同步更新畫面上方名稱。
         */
        if (
            String(
                activeCloudWorkspaceId
            ) ===
            workspaceId
        ) {
            setActiveCloudWorkspaceName(
                savedName
            );
        }

        /*
         * 成功後先關閉改名視窗，
         * 再重新讀取 Workspace 清單。
         */
        closeCloudWorkspaceRenameModal(
            true
        );

        await loadCloudWorkspaceList();

        updateCloudWorkspaceStatus(
            `已將工作資料名稱更新為「${savedName}」。`,
            'success'
        );

        showSystemToast(
            '雲端工作資料名稱已更新'
        );

    } catch (error) {
        console.error(
            'Cloud Workspace 名稱修改失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        /*
         * 使用者取消第二層登入時，
         * 不顯示成資料錯誤。
         */
        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        const messages = {
            WORKSPACE_NOT_FOUND:
                '找不到這份雲端工作資料。',

            WORKSPACE_NAME_INVALID:
                '工作資料名稱格式不正確。',

            WORKSPACE_SYSTEM_MISMATCH:
                '這份工作資料不屬於目前法規鑑別系統。',

            WORKSPACE_RENAME_FAILED:
                '雲端工作資料名稱更新失敗。',

            WORKSPACE_RENAME_INVALID:
                '伺服器回傳的更新結果不完整。',

            ADMIN_REQUIRED:
                '目前帳號沒有此操作權限。'
        };

        updateCloudWorkspaceRenameStatus(
            messages[code] ||
            '修改工作資料名稱失敗，請稍後再試。',
            'error'
        );

    } finally {
        setCloudWorkspaceRenameBusy(
            false
        );
    }
};

/* =========================================================
   Cloud Workspace：停用／重新啟用
========================================================= */

/*
 * 切換 Workspace 啟用狀態。
 *
 * 只有管理者可以操作。
 */
const toggleCloudWorkspaceEnabled =
    async (
        workspace
    ) => {

    if (
        getCurrentRole() !==
        'admin'
    ) {
        showSystemToast(
            '僅管理者可變更雲端工作資料狀態。',
            'error'
        );

        return;
    }

    /*
     * 其他 Workspace 操作進行中時，
     * 不重複送出狀態修改。
     */
    if (
        cloudWorkspaceListBusy ||
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    const workspaceId =
        String(
            workspace?.id ||
            ''
        ).trim();

    const workspaceName =
        String(
            workspace?.workspace_name ||
            '未命名工作資料'
        ).trim();

    const currentlyEnabled =
        workspace?.enabled !==
        false;

    const nextEnabled =
        !currentlyEnabled;

    if (!workspaceId) {
        updateCloudWorkspaceStatus(
            '找不到要變更的雲端工作資料。',
            'error'
        );

        return;
    }

    const confirmed =
        window.confirm(
            currentlyEnabled
                ? (
                    `確定要停用「${workspaceName}」？\n\n` +
                    '停用後將無法載入或繼續儲存；' +
                    '資料不會刪除，之後仍可重新啟用。'
                )
                : `確定要重新啟用「${workspaceName}」？`
        );

    if (!confirmed) {
        return;
    }

    setCloudWorkspaceAction({
        workspaceId:
            workspaceId,

        type:
            'toggle'
    });

    updateCloudWorkspaceStatus(
        nextEnabled
            ? `正在重新啟用「${workspaceName}」...`
            : `正在停用「${workspaceName}」...`,
        'info'
    );

    try {
        await cloudWorkspaceRequest({
            action:
                'set-enabled',

            system_type:
                OSH_CLOUD_SYSTEM_TYPE,

            workspace_id:
                workspaceId,

            enabled:
                nextEnabled
        });

        /*
         * 如果停用的是目前已載入的 Workspace，
         * 只解除目前 Cloud Workspace 關聯。
         *
         * 不清除畫面上的法規鑑別資料，
         * 也不刪除 Supabase 工作資料。
         */
        if (
            !nextEnabled &&
            String(
                activeCloudWorkspaceId
            ) ===
            workspaceId
        ) {
            clearActiveCloudWorkspace();
        }

        await loadCloudWorkspaceList();

        updateCloudWorkspaceStatus(
            nextEnabled

/*
 * 永久刪除 Workspace。
 *
 * 只有管理者可以操作，
 * 並使用兩次確認避免誤刪。
 */
const deleteCloudWorkspace =
    async (
        workspace
    ) => {

    if (
        getCurrentRole() !==
        'admin'
    ) {
        showSystemToast(
            '僅管理者可刪除雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 其他 Workspace 操作進行中時，
     * 不重複送出刪除要求。
     */
    if (
        cloudWorkspaceListBusy ||
        cloudWorkspaceCreateBusy ||
        cloudWorkspaceSaveBusy ||
        cloudWorkspaceActionBusy ||
        cloudWorkspaceRenameBusy
    ) {
        return;
    }

    const workspaceId =
        String(
            workspace?.id ||
            ''
        ).trim();

    const workspaceName =
        String(
            workspace?.workspace_name ||
            '未命名工作資料'
        ).trim();

    if (!workspaceId) {
        updateCloudWorkspaceStatus(
            '找不到要刪除的雲端工作資料。',
            'error'
        );

        return;
    }

    /*
     * 第一層確認：
     * 確認刪除目標。
     */
    const firstConfirmed =
        window.confirm(
            `確定要刪除「${workspaceName}」？`
        );

    if (!firstConfirmed) {
        return;
    }

    /*
     * 第二層確認：
     * 明確告知永久刪除不可復原。
     */
    const secondConfirmed =
        window.confirm(
            '此操作將永久刪除這份雲端工作資料，' +
            '刪除後無法復原。\n\n' +
            '確定要繼續嗎？'
        );

    if (!secondConfirmed) {
        return;
    }

    setCloudWorkspaceAction({
        workspaceId:
            workspaceId,

        type:
            'delete'
    });

    updateCloudWorkspaceStatus(
        `正在永久刪除「${workspaceName}」...`,
        'info'
    );

    try {
        await cloudWorkspaceRequest({
            action:
                'delete',

            system_type:
                OSH_CLOUD_SYSTEM_TYPE,

            workspace_id:
                workspaceId
        });

        /*
         * 若刪除的是目前 active Workspace，
         * 只解除 Workspace 關聯。
         *
         * 不清除目前畫面上的法規鑑別資料。
         */
        if (
            String(
                activeCloudWorkspaceId
            ) ===
            workspaceId
        ) {
            clearActiveCloudWorkspace();
        }

        await loadCloudWorkspaceList();

        updateCloudWorkspaceStatus(
            `「${workspaceName}」已永久刪除。`,
            'success'
        );

        showSystemToast(
            '雲端工作資料已刪除'
        );

    } catch (error) {
        console.error(
            'Cloud Workspace 刪除失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        const messages = {
            ADMIN_REQUIRED:
                '僅管理者可刪除雲端工作資料。',

            WORKSPACE_NOT_FOUND:
                '找不到這份雲端工作資料。',

            WORKSPACE_SYSTEM_MISMATCH:
                '這份工作資料不屬於目前法規鑑別系統。',

            WORKSPACE_FILES_LOOKUP_FAILED:
                '無法取得工作資料附件清單。',

            WORKSPACE_STORAGE_PATH_MISMATCH:
                '雲端附件資料狀態異常，系統已停止刪除。',

            WORKSPACE_STORAGE_DELETE_FAILED:
                '雲端附件刪除失敗，工作資料尚未刪除。',

            WORKSPACE_DELETE_FAILED:
                '雲端工作資料刪除失敗。'
        };

        updateCloudWorkspaceStatus(
            messages[code] ||
            '刪除雲端工作資料失敗，請稍後再試。',
            'error'
        );

    } finally {
        setCloudWorkspaceAction({
            workspaceId: '',
            type: ''
        });
    }
};

/*

 * 都產生全新的 previewId。
 */
const createLimitedPreviewId = () => {
    const randomPart =
        window.crypto &&
        typeof window.crypto.randomUUID ===
            'function'
            ? window.crypto.randomUUID()
            : (
                `${Date.now()}-` +

    );
};


/*
 * 驗證預覽專用檔案，
 * 並計算本瀏覽器已使用次數。
 */
const validateAndConsumeLimitedPreview =
    (data) => {

    if (
        !data ||
        data.version !==
            'regulation-identification-preview-json-v1' ||
        data.exportType !==
            'limited-preview' ||
        data.systemType !==
            'regulation-identification' ||
        !Array.isArray(
            data.laws
        ) ||
        !data.lawDetails ||
        typeof data.lawDetails !==
            'object' ||
        Array.isArray(
            data.lawDetails
        )
    ) {
        return {
            ok: false,

            message:
                '此檔案不是本系統產生的預覽專用檔案。'
        };
    }


    const previewId =
        String(
            data.previewId || ''
        ).trim();


    const expiresAtMs =
        new Date(
            data.expiresAt
        ).getTime();


    const maxViews =
        Number(
            data.maxViews
        );


    if (
        !previewId ||
        !Number.isFinite(
            expiresAtMs
        ) ||
        !Number.isInteger(
            maxViews
        ) ||
        maxViews < 1
    ) {
        return {
            ok: false,

            message:
                '預覽檔案的限制設定不完整，無法開啟。'
        };
    }


    /*
     * 有效期限檢查
     */
    if (
        Date.now() >=
        expiresAtMs
    ) {
        return {
            ok: false,

            message:
                '此預覽資料已超過有效期限。\n\n' +
                '如需再次查看，請重新向資料提供者索取新的預覽檔案。'
        };
    }


    const storageKey =
        LIMITED_PREVIEW_STORAGE_PREFIX +
        previewId;


    let usage = {
        count: 0,
        expiresAt:
            data.expiresAt
    };


    try {
        const stored =
            localStorage.getItem(
                storageKey
            );


        if (stored) {
            const parsed =
                JSON.parse(
                    stored
                );

            usage.count =
                Math.max(
                    Math.floor(
                        Number(
                            parsed.count ||
                            0
                        )
                    ),
                    0
                );
        }


        if (
            usage.count >=
            maxViews
        ) {
            return {
                ok: false,

                message:
                    '此預覽資料已達可開啟次數上限。\n\n' +
                    '如需再次查看，請重新向資料提供者索取新的預覽檔案。'
            };
        }


        /*
         * 成功開啟一次
         */
        usage.count += 1;

        usage.expiresAt =
            data.expiresAt;


        localStorage.setItem(
            storageKey,
            JSON.stringify(
                usage
            )
        );

    } catch (error) {
        console.warn(
            '預覽使用紀錄存取失敗：',
            error
        );

        return {
            ok: false,

            message:
                '瀏覽器目前無法建立預覽使用紀錄。\n\n' +
                '為避免預覽限制失效，本次資料不予開啟。'
        };
    }


    return {
        ok: true,

        previewId,

        usedCount:
            usage.count,

        maxViews,

        expiresAtMs
    };
};

/*
 * 產生同一次發布固定使用的 UUID。
 *
 * Retry 時不可重新產生，
 * 否則可能建立重複 Preview。
 */
const createCloudPublishRequestId =
    () => {

    if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
            'function'
    ) {
        return window.crypto.randomUUID();
    }

    if (
        window.crypto &&
        typeof window.crypto.getRandomValues ===
            'function'
    ) {
        const bytes =
            new Uint8Array(16);

        window.crypto.getRandomValues(
            bytes
        );

        bytes[6] =
            (
                bytes[6] &
                0x0f
            ) |
            0x40;

        bytes[8] =
            (
                bytes[8] &
                0x3f
            ) |
            0x80;

        const hex =
            Array.from(
                bytes,
                value =>
                    value
                        .toString(16)
                        .padStart(2, '0')
            );

        return (
            hex.slice(0, 4).join('') +
            '-' +
            hex.slice(4, 6).join('') +
            '-' +
            hex.slice(6, 8).join('') +
            '-' +
            hex.slice(8, 10).join('') +
            '-' +
            hex.slice(10, 16).join('')
        );
    }

    throw new Error(
        'PREVIEW_PUBLISH_FAILED'
    );
};

 * 更新 React 發布狀態訊息。

/*
 * 僅供可安全重播的 Cloud Preview
 * 操作使用。
 */
const runCloudPreviewWithRetry =
    async (
        operation,
        {
            maxAttempts = 3,
            onRetry = null
        } = {}
    ) => {

    let lastError = null;

    for (
        let attempt = 1;
        attempt <= maxAttempts;
        attempt++
    ) {
        try {
            return await operation();

        } catch (error) {
            lastError =
                error;

            const code =
                String(
                    error?.message ||
                    ''
                );

            const status =
                Number(
                    error?.status ||
                    0
                );

            const retryableCodes =
                new Set([
                    'PUBLISHER_LOOKUP_FAILED'
                ]);

            const retryableStatus =
                status === 408 ||
                status === 425 ||
                status === 429 ||
                status === 500 ||
                status === 502 ||
                status === 503 ||
                status === 504;

            const canRetry =
                retryableCodes.has(
                    code
                ) ||
                retryableStatus;

            if (
                !canRetry ||
                attempt >= maxAttempts
            ) {
                throw error;
            }

            const nextAttempt =
                attempt + 1;

            if (
                typeof onRetry ===
                    'function'
            ) {
                onRetry(
                    nextAttempt,
                    maxAttempts,
                    error
                );
            }

            /*
             * 第一次失敗等約 1 秒，
             * 第二次失敗等約 2 秒。
             */
            await new Promise(
                resolve =>
                    window.setTimeout(
                        resolve,
                        attempt * 1000
                    )
            );
        }
    }

    throw (
        lastError ||
        new Error(
            'PREVIEW_PUBLISH_FAILED'
        )
    );
};

/*
 * 正式發布法規鑑別 Cloud Preview。
 *
 * 法規系統目前沒有附件，所以流程為：
 *
 * 建立 building Preview
 * → 維持停用
 * → 寫入正式 unified-data
 * → 最後才啟用
 */
const submitCloudPreviewPublish =
    async () => {

    /*
     * 第一層權限重新檢查。
     */
    if (
        !isAdmin &&
        !isEditor
    ) {
        updateCloudPreviewPublishStatus(
            '目前無法發布雲端預覽。',
            'error'
        );

        return;
    }

    if (
        previewDataModeRef.current
    ) {
        updateCloudPreviewPublishStatus(
            '預覽資料不能再次發布為雲端預覽。',
            'error'
        );

        return;
    }

    /*
     * 送出時再次檢查，
     * 避免進入表單後資料狀態改變。
     */
    if (
        hasAnyUnsavedChanges()
    ) {
        updateCloudPreviewPublishStatus(
            '請先儲存目前的法規鑑別修改後再發布。',
            'error'
        );

        return;
    }

    if (cloudPreviewPublishBusy) {
        return;
    }

    const previewName =
        String(
            cloudPreviewPublishName ||
            ''
        ).trim();

    const previewPassword =
        String(
            cloudPreviewPublishPassword ||
            ''
        );

    const expiryHours =
        Number(
            cloudPreviewPublishExpiryHours
        );

    const maxViews =
        Number(
            cloudPreviewPublishMaxViews
        );

    if (!previewName) {
        updateCloudPreviewPublishStatus(
            '請輸入預覽名稱。',
            'error'
        );

        requestAnimationFrame(
            () => {
                cloudPreviewPublishNameInputRef
                    .current
                    ?.focus();
            }
        );

        return;
    }

    if (
        previewName.length >
        80
    ) {
        updateCloudPreviewPublishStatus(
            '預覽名稱不可超過 80 個字元。',
            'error'
        );

        return;
    }

    if (!previewPassword) {
        updateCloudPreviewPublishStatus(
            '請設定預覽密碼。',
            'error'
        );

        requestAnimationFrame(
            () => {
                cloudPreviewPublishPasswordInputRef
                    .current
                    ?.focus();
            }
        );

        return;
    }

    if (
        !Number.isFinite(
            expiryHours
        ) ||
        expiryHours <= 0
    ) {
        updateCloudPreviewPublishStatus(
            '有效期限設定錯誤。',
            'error'
        );

        return;
    }

    if (
        !Number.isInteger(
            maxViews
        ) ||
        maxViews < 1
    ) {
        updateCloudPreviewPublishStatus(
            '可開啟次數設定錯誤。',
            'error'
        );

        return;
    }

    const expiresAt =
        new Date(
            Date.now() +
            expiryHours *
            60 *
            60 *
            1000
        ).toISOString();

    /*
     * 同一次發布的所有 Retry
     * 固定使用同一個 Request ID。
     */
    const publishRequestId =
        createCloudPublishRequestId();

    let previewId =
        '';

    let rollbackFailed =
        false;

    try {
        setCloudPreviewPublishBusy(
            true
        );

        updateCloudPreviewPublishStatus(
            '正在準備法規鑑別資料...',
            'info'
        );

        /*
         * 建立正式 unified-data。
         */
        const sourceData =
            buildRegulationIdentificationExportData();

        /*
         * 先建立 building Preview。
         *
         * 這個階段不寫入正式法規內容，
         * 且 Preview 尚未啟用。
         */
        updateCloudPreviewPublishStatus(
            '正在建立雲端預覽...',
            'info'
        );

        const publishResult =
            await runCloudPreviewWithRetry(
                async () => {

                    try {
                        return await cloudAdminRequest({
                            action:
                                'publish',

                            system_type:
                                OSH_CLOUD_SYSTEM_TYPE,

                            publish_request_id:
                                publishRequestId,

                            preview_name:
                                previewName,

                            preview_password:
                                previewPassword,

                            expires_at:
                                expiresAt,

                            max_views:
                                maxViews,

                            payload: {
                                version:
                                    'regulation-identification-cloud-preview-building-v1',

                                status:
                                    'building'
                            }
                        });

                    } catch (error) {
                        /*
                         * 已收到 HTTP 回應時，
                         * 保留後端正式錯誤。
                         */
                        if (
                            Number(
                                error?.status ||
                                0
                            ) > 0
                        ) {
                            throw error;
                        }

                        /*
                         * fetch 本身中斷時，
                         * 轉成可以安全 Retry 的 503。
                         */
                        const networkError =
                            new Error(
                                'PREVIEW_PUBLISH_FAILED'
                            );

                        networkError.status =
                            503;

                        throw networkError;
                    }
                },
                {
                    maxAttempts: 3,

                    onRetry: (
                        attempt,
                        maxAttempts
                    ) => {
                        updateCloudPreviewPublishStatus(
                            `雲端連線暫時不穩定，正在重新建立雲端預覽 ${attempt} / ${maxAttempts}...`,
                            'info'
                        );
                    }
                }
            );

        previewId =
            String(
                publishResult
                    ?.preview
                    ?.id ||
                ''
            );

        if (!previewId) {
            throw new Error(
                'PREVIEW_PUBLISH_FAILED'
            );
        }

        /*
         * Backend 建立時原本就是：
         *
         * building
         * enabled = false
         *
         * 此處再明確維持停用狀態。
         */
        await cloudAdminRequest({
            action:
                'set-enabled',

            preview_id:
                previewId,

            enabled:
                false
        });

        updateCloudPreviewPublishStatus(
            '正在完成雲端資料...',
            'info'
        );

        /*
         * 法規系統沒有附件，
         * 可直接建立最終 Payload。
         */
        const finalPayload =
            buildRegulationIdentificationCloudPayload(
                sourceData
            );

        /*
         * 寫入正式法規鑑別資料。
         */
        await cloudAdminRequest({
            action:
                'update',

            preview_id:
                previewId,

            payload:
                finalPayload
        });

        /*
         * 正式資料全部完成後，
         * 最後才啟用 Preview。
         *
         * set-enabled:true 具備冪等性，
         * 可以安全 Retry。
         */
        await runCloudPreviewWithRetry(
            async () => {

                try {
                    return await cloudAdminRequest({
                        action:
                            'set-enabled',

                        preview_id:
                            previewId,

                        enabled:
                            true
                    });

                } catch (error) {
                    if (
                        Number(
                            error?.status ||
                            0
                        ) > 0
                    ) {
                        throw error;
                    }

                    const networkError =
                        new Error(
                            'PREVIEW_UPDATE_FAILED'
                        );

                    networkError.status =
                        503;

                    throw networkError;
                }
            },
            {
                maxAttempts: 3,

                onRetry: (
                    attempt,
                    maxAttempts
                ) => {
                    updateCloudPreviewPublishStatus(
                        `正式發布確認暫時中斷，正在自動重試 ${attempt} / ${maxAttempts}...`,
                        'info'
                    );
                }
            }
        );

        /*
         * 發布正式完成。
         */
        updateCloudPreviewPublishStatus(
            '雲端預覽發布完成。',
            'success'
        );

        window.alert(
            '雲端預覽發布成功！\n\n' +
            `Preview ID：${previewId}\n` +
            `預覽密碼：${previewPassword}\n\n` +
            '請將以上資訊提供給預覽者。'
        );

        /*
         * 成功後不保留預覽密碼。
         */
        setCloudPreviewPublishPassword('');

        setCloudPreviewPublishStatus({
            message: '',
            type: 'info'
        });

        setCloudCenterView(
            'home'
        );

        showSystemToast(
            '雲端預覽已發布'
        );

    } catch (error) {
        console.error(
            '法規鑑別雲端預覽發布失敗：',
            error
        );

        /*
         * Preview 已建立但後續失敗時，
         * 自動刪除未完成資料。
         */
        if (previewId) {
            try {
                await runCloudPreviewWithRetry(
                    async () => {

                        try {
                            return await cloudAdminRequest({
                                action:
                                    'delete',

                                preview_id:
                                    previewId,

                                rollback_delete:
                                    true
                            });

                        } catch (rollbackRequestError) {
                            if (
                                Number(
                                    rollbackRequestError
                                        ?.status ||
                                    0
                                ) > 0
                            ) {
                                throw rollbackRequestError;
                            }

                            const networkError =
                                new Error(
                                    'PREVIEW_DELETE_FAILED'
                                );

                            networkError.status =
                                503;

                            throw networkError;
                        }
                    },
                    {
                        maxAttempts: 3,

                        onRetry: (
                            attempt,
                            maxAttempts
                        ) => {
                            updateCloudPreviewPublishStatus(
                                `正在清理未完成的雲端預覽，重新嘗試 ${attempt} / ${maxAttempts}...`,
                                'info'
                            );
                        }
                    }
                );

            } catch (rollbackError) {
                rollbackFailed =
                    true;

                console.error(
                    '法規鑑別雲端預覽 rollback 刪除失敗：',
                    rollbackError
                );
            }
        }

        const message =
            getCloudPreviewPublishErrorMessage(
                error
            );

        updateCloudPreviewPublishStatus(
            rollbackFailed
                ? (
                    `${message} ` +
                    '請至「管理雲端預覽」確認並刪除未完成資料。'
                )
                : message,
            'error'
        );

    } finally {
        setCloudPreviewPublishBusy(
            false
        );
    }
};

/*
 * 將 Supabase 日期轉成台灣顯示格式。
 */
const formatCloudPreviewDate =
    (value) => {

    if (!value) {
        return '-';
    }

    const date =
        new Date(
            value
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return '-';
    }

    return date.toLocaleString(
        'zh-TW',
        {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        }
    );
};


/*
 * 依 Preview 狀態、期限與次數，
 * 建立圖卡狀態標籤。
 */
const getCloudPreviewStatusInfo =
    (preview) => {

    const enabled =
        preview?.enabled === true;

    const viewCount =
        Number(
            preview?.view_count
        ) || 0;

    const maxViews =
        Number(
            preview?.max_views
        ) || 0;

    const expiresAt =
        new Date(
            preview?.expires_at
        ).getTime();

    if (!enabled) {
        return {
            label: '已停用',

            className:
                'bg-slate-100 text-slate-600 border-slate-200'
        };
    }

    if (
        Number.isFinite(
            expiresAt
        ) &&
        expiresAt <= Date.now()
    ) {
        return {
            label: '已到期',

            className:
                'bg-amber-50 text-amber-700 border-amber-100'
        };
    }

    if (
        maxViews > 0 &&
        viewCount >= maxViews
    ) {
        return {
            label: '次數已滿',

            className:
                'bg-red-50 text-red-600 border-red-100'
        };
    }

return {
    label: '使用中',

    className:
        'bg-emerald-100 text-emerald-700 border-emerald-100'
};
};

    async () => {

    const role =
        getCurrentRole();

    if (

        role !== 'editor'
    ) {
        updateCloudPreviewManageStatus(
            '目前權限無法查看雲端預覽紀錄。',

            await cloudAdminRequest({

            setCloudCenterView(

            return;

        let message =
            '無法讀取雲端預覽，請稍後再試。';

        if (
            Number(
                error?.status
            ) === 401

            message =
                '雲端登入已失效，請重新登入。';

        } else if (
            Number(
                error?.status
            ) === 403
        ) {
            clearCloudPublisherSession();

            message =
                '目前 Cloud Publisher 帳號無法讀取雲端預覽，請重新登入或聯絡管理者。';
        }

        setCloudPreviewManageItems(
            []

        updateCloudPreviewManageStatus(
            message,
            'error'
        );

    } finally {
        setCloudPreviewManageBusy(
            false
        );
    }
};

 * 停用／重新開放雲端預覽

 */
const toggleCloudPreviewEnabled =
    async (
        preview
    ) => {

    if (
        getCurrentRole() !==
        'admin'
    ) {
        showSystemToast(
            '僅管理者可變更雲端預覽狀態。',
            'error'
        );

        return;
    }

    if (
        cloudPreviewManageBusy ||
        cloudPreviewManageActionBusy
    ) {
        return;
    }

    const previewId =
        String(
            preview?.id ||
            ''
        ).trim();

    const previewName =
        String(
            preview?.preview_name ||
            '未命名預覽'
        ).trim();

    const currentlyEnabled =
        preview?.enabled === true;

    const nextEnabled =
        !currentlyEnabled;

    if (!previewId) {
        updateCloudPreviewManageStatus(
            '找不到要變更的雲端預覽。',
            'error'
        );

        return;
    }

    const confirmMessage =
        currentlyEnabled
            ? (
                `確定要停用「${previewName}」？\n\n` +
                '停用後，預覽者將暫時無法使用 Preview ID 與密碼開啟此預覽。\n\n' +
                '雲端資料不會被刪除，之後仍可重新開放。'
            )
            : (
                `確定要重新開放「${previewName}」？\n\n` +
                '重新開放後，預覽者可再次使用原本的 Preview ID 與密碼開啟。\n\n' +
                '如果預覽已到期或開啟次數已滿，原有限制仍然有效。'
            );

    if (
        !window.confirm(
            confirmMessage
        )
    ) {
        return;
    }

    try {
        setCloudPreviewManageAction({
            previewId,
            type: 'toggle'
        });

        updateCloudPreviewManageStatus(
            nextEnabled
                ? `正在重新開放「${previewName}」...`
                : `正在停用「${previewName}」...`,
            'info'
        );

        await cloudAdminRequest({
            action:
                'set-enabled',

            preview_id:
                previewId,

            enabled:
                nextEnabled
        });

        await loadCloudPreviewManageList();

        updateCloudPreviewManageStatus(
            nextEnabled
                ? `「${previewName}」已重新開放。`
                : `「${previewName}」已停用。`,
            'success'
        );

    } catch (error) {
        console.error(
            '變更法規鑑別雲端預覽狀態失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        if (
            code ===
            'CLOUD_LOGIN_CANCELLED'
        ) {
            return;
        }

        let message =
            nextEnabled
                ? '重新開放雲端預覽失敗，請稍後再試。'
                : '停用雲端預覽失敗，請稍後再試。';

        if (
            Number(
                error?.status
            ) === 401
        ) {
            message =
                '雲端登入已失效，請重新登入。';

        } else if (
            Number(
                error?.status
            ) === 403
        ) {
            message =
                '此帳號沒有管理雲端預覽的權限。';

        } else if (
            code ===
            'PREVIEW_NOT_FOUND'
        ) {
            message =
                '找不到此雲端預覽，可能已被刪除。';
        }

        updateCloudPreviewManageStatus(
            message,
            'error'
        );

    } finally {
        setCloudPreviewManageAction({
            previewId: '',
            type: ''
        });
    }
};

/*
 * Supabase ISO 日期轉換為
 * datetime-local 可以顯示的格式。
 */
const formatCloudPreviewDateTimeLocal =
    (
        value
    ) => {

    const date =
        new Date(
            value
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return '';
    }

    const pad =
        number =>
            String(number)
                .padStart(
                    2,
                    '0'
                );

    return (
        `${date.getFullYear()}-` +
        `${pad(date.getMonth() + 1)}-` +
        `${pad(date.getDate())}T` +
        `${pad(date.getHours())}:` +
        `${pad(date.getMinutes())}`
    );
};

            'error'

    }

    const minimumMaxViews =
        Math.max(
            1,
            viewCount
        );

    const normalizedMaxViews =
        Number.isInteger(
            originalMaxViews
        ) &&
        originalMaxViews > 0
            ? originalMaxViews
            : minimumMaxViews;

    setCloudPreviewEditTarget({
        previewId,
        originalName:
            previewName,
        originalExpiresLocal:
            expiresLocal,
        originalMaxViews:
            normalizedMaxViews,
        viewCount
    });

    setCloudPreviewEditName(
        previewName
    );

    /*
     * 後端不會回傳原密碼。
     * 保持空白代表不修改密碼。
     */
    setCloudPreviewEditPassword('');

    setCloudPreviewEditExpiry(
        expiresLocal
    );

    setCloudPreviewEditMaxViews(
        String(
            normalizedMaxViews
        )
    );

    setCloudPreviewEditStatus({
        message: '',
        type: 'info'
    });

    setCloudPreviewEditBusy(
        false
    );

    setShowCloudPreviewEditModal(
        true
    );

 */
const submitCloudPreviewEdit =
    async () => {

    if (
        getCurrentRole() !==
        'admin'
    ) {
        updateCloudPreviewEditStatus(
            '僅管理者可編輯雲端預覽。',
            'error'
        );

        return;
    }

    if (cloudPreviewEditBusy) {
        return;
    }

    const previewId =
        String(
            cloudPreviewEditTarget
                .previewId ||
            ''
        ).trim();

    const originalName =
        String(
            cloudPreviewEditTarget
                .originalName ||
            ''
        );

    const originalExpiresLocal =
        String(
            cloudPreviewEditTarget
                .originalExpiresLocal ||
            ''
        );

    const originalMaxViews =
        Number(
            cloudPreviewEditTarget
                .originalMaxViews
        );

    const viewCount =
        Number(
            cloudPreviewEditTarget
                .viewCount
        ) || 0;

    const previewName =
        String(
            cloudPreviewEditName ||
            ''
        ).trim();

    const previewPassword =
        String(
            cloudPreviewEditPassword ||
            ''
        );

    const expiresLocal =
        String(
            cloudPreviewEditExpiry ||
            ''
        ).trim();

    const maxViews =
        Number(
            cloudPreviewEditMaxViews
        );

    if (!previewId) {
        updateCloudPreviewEditStatus(
            '找不到要編輯的雲端預覽。',
            'error'
        );

        return;
    }

    if (!previewName) {
        updateCloudPreviewEditStatus(
            '請輸入預覽名稱。',
            'error'
        );

        cloudPreviewEditNameInputRef
            .current
            ?.focus();

        return;
    }

    if (
        previewName.length >
        80
    ) {
        updateCloudPreviewEditStatus(
            '預覽名稱不可超過 80 個字元。',
            'error'
        );

        cloudPreviewEditNameInputRef
            .current
            ?.focus();

        return;
    }

    if (
        !Number.isInteger(
            maxViews
        ) ||
        maxViews < 1
    ) {
        updateCloudPreviewEditStatus(
            '可開啟次數設定錯誤。',
            'error'
        );

        cloudPreviewEditMaxViewsInputRef
            .current
            ?.focus();

        return;
    }

    if (
        maxViews <
        viewCount
    ) {
        updateCloudPreviewEditStatus(
            `可開啟次數不可低於目前已使用的 ${viewCount} 次。`,
            'error'
        );

        cloudPreviewEditMaxViewsInputRef
            .current
            ?.focus();

        return;
    }

    const request = {
        action:
            'update',

        preview_id:
            previewId
    };

    let hasChanges =
        false;

    /*
     * 名稱只有真正改變時才送出。
     */
    if (
        previewName !==
        originalName
    ) {
        request.preview_name =
            previewName;

        hasChanges =
            true;
    }

    /*
     * 有效期限只有真正改變時才檢查。
     *
     * 因此已到期的 Preview
     * 仍可只修改名稱或次數。
     */
    if (
        expiresLocal !==
        originalExpiresLocal
    ) {
        const expiresAtMs =
            new Date(
                expiresLocal
            ).getTime();

        if (
            !Number.isFinite(
                expiresAtMs
            ) ||
            expiresAtMs <=
                Date.now()
        ) {
            updateCloudPreviewEditStatus(
                '有效期限必須設定為目前時間之後。',
                'error'
            );

            cloudPreviewEditExpiryInputRef
                .current
                ?.focus();

            return;
        }

        request.expires_at =
            new Date(
                expiresAtMs
            ).toISOString();

        hasChanges =
            true;
    }

    /*
     * 可開啟次數。
     */
    if (
        maxViews !==
        originalMaxViews
    ) {
        request.max_views =
            maxViews;

        hasChanges =
            true;
    }

    /*
     * 密碼留白代表沿用原密碼。
     */
    if (
        previewPassword.length >
        0
    ) {
        request.preview_password =
            previewPassword;

        hasChanges =
            true;
    }

    if (!hasChanges) {
        updateCloudPreviewEditStatus(
            '目前沒有需要更新的內容。',
            'info'
        );

        return;
    }

    try {
        setCloudPreviewEditBusy(
            true
        );

        updateCloudPreviewEditStatus(
            '正在儲存雲端預覽設定...',
            'info'
        );

        await cloudAdminRequest(
            request
        );

        closeCloudPreviewEditModal(
            true
        );

        await loadCloudPreviewManageList();

        updateCloudPreviewManageStatus(
            `「${previewName}」已更新。`,
            'success'
        );

    } catch (error) {
        console.error(
            '編輯法規鑑別雲端預覽失敗：',
            error
        );

        const code =
            String(
                error?.message ||
                ''
            );

        let message =
            '編輯雲端預覽失敗，請稍後再試。';

        if (
            Number(
                error?.status
            ) === 401
        ) {
            message =
                '雲端登入已失效，請重新登入。';

        } else if (
            Number(
                error?.status
            ) === 403
        ) {
            message =
                '此帳號沒有編輯雲端預覽的權限。';

        } else if (
            code ===
            'MAX_VIEWS_BELOW_CURRENT_COUNT'
        ) {
            message =
                '可開啟次數不可低於目前已使用的次數。';

        } else if (
            code ===
            'EXPIRES_AT_INVALID'
        ) {
            message =
                '有效期限必須設定為目前時間之後。';

        } else if (
            code ===
            'PREVIEW_UPDATE_CONFLICT'
        ) {
            message =
                '雲端預覽資料已變更，請重新整理後再試。';

        } else if (
            code ===
            'PREVIEW_NOT_FOUND'
        ) {
            message =
                '找不到此雲端預覽，可能已被刪除。';
        }

        updateCloudPreviewEditStatus(
            message,
            'error'
        );

    } finally {
        setCloudPreviewEditBusy(
            false
        );
    }
};

const importDatabase = (
    event,
    mode = 'import'
) => {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    if (
        mode === 'import' &&
        !canImportData()
    ) {
        alert(
            '請先登入使用者或管理者權限後再載入資料。'
        );

        setShowLoginModal(true);

        event.target.value =
            '';

        return;
    }


    if (
        mode === 'preview' &&
        !canLoadPreviewData()
    ) {
        alert(
            '目前無法載入預覽資料。'
        );

        event.target.value =
            '';

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        async (e) => {

        try {
            const importedData =
                JSON.parse(
                    e.target.result
                );


            /* =====================================================
               Viewer：
               只接受預覽專用檔案
            ===================================================== */
            if (
                mode ===
                'preview'
            ) {

                const previewCheck =
                    validateAndConsumeLimitedPreview(
                        importedData
                    );


                if (
                    !previewCheck.ok
                ) {
                    alert(
                        previewCheck.message
                    );

                    return;
                }


                /*
                 * 正常 Viewer 不會有正式修改，
                 * 這裡仍保留防呆。
                 */
                if (
                    hasPendingSessionChanges()
                ) {
                    const confirmed =
                        window.confirm(
                            '目前有尚未儲存的修改。\n\n' +
                            '載入預覽資料將覆蓋目前畫面內容，' +
                            '這些未儲存修改將被放棄。\n\n' +
                            '確定要繼續嗎？'
                        );


                    if (!confirmed) {
                        return;
                    }
                }


                /*
                 * 保存 Viewer 進入預覽前
                 * 原本看到的畫面資料。
                 */
                previewReturnLawsRef.current =
                    JSON.parse(
                        JSON.stringify(
                            laws
                        )
                    );


                previewReturnLawDetailsRef.current =
                    JSON.parse(
                        JSON.stringify(
                            lawDetails
                        )
                    );


                previewDataModeRef.current =
                    true;


                setIsPreviewDataMode(
                    true
                );


                setIsMonitorEditMode(
                    false
                );

                setIsWorkbenchEditMode(
                    false
                );


                monitorManualDirtyRef.current =
                    false;

                workbenchManualDirtyRef.current =
                    false;

                monitorCascadeDetailsDirtyRef.current =
                    false;

                pendingDeletedLawIdsRef.current.clear();

                sessionNeedsExportRef.current =
                    false;


                setSelectedLaw(
                    null
                );

                setActiveTab(
                    'monitor'
                );


                setLaws(
                    importedData.laws
                );

                setLawDetails(
                    importedData.lawDetails
                );


                /*
                 * 啟動到期 Timer。
                 */
                startLimitedPreviewExpiryTimer(
                    importedData
                );


                alert(
                    '預覽資料載入成功！' 
                );


                return;
            }


            /* =====================================================
               User / Admin：
               預覽專用檔案不能進正式工作區
            ===================================================== */
            if (
                importedData &&
                importedData.exportType ===
                    'limited-preview'
            ) {

                alert(
                    '此檔案為預覽專用資料，不能載入正式工作區。\n\n' +
                    '如需接續編輯，請使用正式「匯出資料」所產生的檔案。'
                );


                return;
            }


            /*
             * 正式資料仍沿用原本
             * v2 與舊版格式相容邏輯。
             */
            const parsedData =
                applyImportedRegulationData(
                    importedData
                );


            const importLabel =
                isAdmin
                    ? '匯入資料'
                    : '載入資料';


            const pendingWorkWarning =
                hasPendingSessionChanges()

                    ? (
                        '\n\n目前有尚未儲存或尚未匯出的工作成果，' +
                        '繼續後將被覆蓋。'
                    )

                    : '';


            const confirmed =
                window.confirm(
                    `${importLabel}將覆蓋目前所有紀錄，確定要繼續嗎？` +
                    pendingWorkWarning
                );


            if (!confirmed) {
                return;
            }


            /*
             * 正式載入前，
             * 再次清除舊版 IndexedDB。
             */
            await dbManager.clearAll();

            /*
 * 本機正式 JSON 已經取代目前工作區，
 * 因此解除先前載入的 Cloud Workspace 關聯。
 *
 * 只清除 Workspace ID、名稱與 Revision，
 * 不會刪除 Supabase 上的工作資料。
 */
clearActiveCloudWorkspace();

            /*
             * 如之前有預覽 Timer，
             * 正式載入時一定停止。
             */
            clearLimitedPreviewRuntimeState();


            previewReturnLawsRef.current =
                null;

            previewReturnLawDetailsRef.current =
                null;


            previewDataModeRef.current =
                false;


            setIsPreviewDataMode(
                false
            );


            setIsMonitorEditMode(
                false
            );

            setIsWorkbenchEditMode(
                false
            );


            monitorManualDirtyRef.current =
                false;

            workbenchManualDirtyRef.current =
                false;

            monitorCascadeDetailsDirtyRef.current =
                false;

            pendingDeletedLawIdsRef.current.clear();


            sessionNeedsExportRef.current =
                false;


            setSelectedLaw(
                null
            );

            setActiveTab(
                'monitor'
            );


            setLaws(
                parsedData.laws
            );

            setLawDetails(
                parsedData.lawDetails
            );


            alert(
                `${importLabel}成功！`
            );


        } catch (error) {
            console.error(
                '資料載入失敗：',
                error
            );


            alert(
                '資料載入失敗：' +
                (
                    error.message ||
                    '檔案格式不正確或內容已損毀。'
                )
            );


        } finally {
            event.target.value =
                '';
        }
    };


    reader.onerror =
        () => {

        alert(
            '檔案讀取失敗，請重新選擇資料檔案。'
        );

        event.target.value =
            '';
    };


    reader.readAsText(
        file
    );
};

const handleAllSync = async () => {
    if (!canUseSmartSync()) {
        alert('目前權限無法使用智能同步。');
        return;
    }

    setSyncText('智能同步執行中');
    setIsSyncing(true);

    const controller = new AbortController();

    const timeoutId = setTimeout(() => {
        controller.abort();
    }, 60000);

    try {
        const response = await fetch(
            `/api/sync-laws?_=${Date.now()}`,
            {
                method: 'GET',
                signal: controller.signal,
                cache: 'no-store',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache'
                }
            }
        );

        const responseText = await response.text();

        let result;

        try {
            result = JSON.parse(responseText);
        } catch (parseError) {
            throw new Error(
                `後端未回傳有效資料內容。HTTP ${response.status}：` +
                responseText.slice(0, 200)
            );
        }

        if (!response.ok) {
            throw new Error(
                result.error ||
                `後端回應錯誤：HTTP ${response.status}`
            );
        }

        const syncData = Array.isArray(result.data)
            ? result.data
            : [];

        const validSyncData = syncData.filter(item => {
            return (
                item &&
                item.Pcode &&
                /^\d{4}-\d{2}-\d{2}$/.test(
                    String(item.LastUpdate || '')
                )
            );
        });

        if (validSyncData.length === 0) {
            const firstError =
                result.failedItems?.[0]?.Error ||
                syncData.find(item => item?.Error)?.Error ||
                result.error ||
                '後端沒有取得任何有效法規日期';

            throw new Error(firstError);
        }

        let updatedCount = 0;
        let unchangedCount = 0;
        let unmatchedCount = 0;

        /*
 * 收集本次智能同步實際更新的正式日期欄位。
 */
const systemLawUpdates = [];

        const normalizedSyncMap = new Map(
            validSyncData.map(item => [
                String(item.Pcode || '')
                    .trim()
                    .toUpperCase(),
                item
            ])
        );

        const nextLaws = laws.map(law => {
            const lawPcode = String(
                law.pcode || ''
            )
                .trim()
                .toUpperCase();

            const match = normalizedSyncMap.get(
                lawPcode
            );

            if (!match) {
                unmatchedCount += 1;
                return law;
            }

            if (
                String(law.remoteDate || '') ===
                String(match.LastUpdate)
            ) {
                unchangedCount += 1;
                return law;
            }

updatedCount += 1;

systemLawUpdates.push({
    id: law.id,
    remoteDate: match.LastUpdate
});

return {
    ...law,
    remoteDate: match.LastUpdate
};
        });

/*
 * 先獨立保存智能同步結果，
 * 再更新 React 畫面。
 *
 * 即使監控清單有尚未儲存的人工修改，
 * remoteDate 仍會正式保存。
 */
await persistLawSystemUpdates(
    systemLawUpdates
);

        setLaws(nextLaws);

        setSelectedLaw(prevSelectedLaw => {
            if (!prevSelectedLaw) {
                return prevSelectedLaw;
            }

            const selectedPcode = String(
                prevSelectedLaw.pcode || ''
            )
                .trim()
                .toUpperCase();

            const match = normalizedSyncMap.get(
                selectedPcode
            );

            if (!match) {
                return prevSelectedLaw;
            }

            return {
                ...prevSelectedLaw,
                remoteDate: match.LastUpdate
            };
        });

        const successCount = Number(
            result.successCount ??
            validSyncData.length
        );

        const failedCount = Number(
            result.failedCount ??
            Math.max(
                0,
                syncData.length - validSyncData.length
            )
        );

        let message =
            `智能同步完成。\n\n` +
            `監測法規：${result.count || syncData.length} 筆\n` +
            `成功取得：${successCount} 筆\n` +
            `日期更新：${updatedCount} 筆\n` +
            `日期相同：${unchangedCount} 筆`;

        if (unmatchedCount > 0) {
            message +=
                `\n前端未匹配：${unmatchedCount} 筆`;
        }

        if (failedCount > 0) {
            const failedNames = (
                Array.isArray(result.failedItems)
                    ? result.failedItems
                    : []
            )
                .slice(0, 8)
                .map(item => {
                    const lawName =
                        item.Name ||
                        item.Pcode ||
                        '未知法規';

                    const errorText =
                        item.Error ||
                        '未取得日期';

                    return `${lawName}：${errorText}`;
                })
                .join('\n');

            message +=
                `\n同步失敗：${failedCount} 筆`;

            if (failedNames) {
                message +=
                    `\n\n失敗項目：\n${failedNames}`;
            }
        }

        alert(message);

    } catch (error) {
        if (error.name === 'AbortError') {
            alert(
                '同步等候逾時。\n\n' +
                '可能是全國法規資料庫暫時回應較慢，' +
                '請稍後再試。'
            );

        } else {
            console.error(
                '法規智能同步失敗：',
                error
            );

            alert(
                '同步失敗：' +
                (
                    error.message ||
                    '未知錯誤'
                )
            );
        }

    } finally {
        clearTimeout(timeoutId);
        setIsSyncing(false);
    }
};
